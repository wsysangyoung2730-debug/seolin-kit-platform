<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>초성 퀴즈 · 서린태권도</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --navy:#06235E; --blue:#0B3C9C; --sky:#4C9BFF; --red:#E8302A; --gold:#FFC93C; --fg:#fff; --muted:#a9bde0; --accent:#FFC93C; --ok:#3ddc97; --line:rgba(255,255,255,.16); --glass:rgba(8,26,64,.72); }
  * { box-sizing:border-box; }
  html { min-height:100%; }
  body { margin:0; min-height:100vh; color:var(--fg); font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; display:flex; flex-direction:column; align-items:center; padding:0 16px 80px;
    background:radial-gradient(circle at 8% 12%,rgba(232,48,42,.35),transparent 38%),radial-gradient(circle at 92% 88%,rgba(47,125,240,.42),transparent 45%),linear-gradient(160deg,#08204f,#040b1e); background-attachment:fixed; }
  .card { background:var(--glass); border:1px solid var(--line); border-radius:28px; padding:clamp(18px,3vw,32px); width:100%; max-width:520px; box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18); backdrop-filter:blur(10px); }
  .card.wide { max-width:1000px; }
  h1 { position:relative; margin:0 0 22px; font-family:"Black Han Sans",sans-serif; font-weight:400; font-size:clamp(34px,4.6vw,54px); text-align:center; letter-spacing:.02em; text-shadow:0 6px 24px rgba(0,0,0,.4); }
  h1::before { content:"ㅊㅅ"; display:inline-block; background:var(--gold); color:var(--navy); padding:.02em .22em; border-radius:.2em; margin-right:.3em; font-size:.8em; vertical-align:.08em; box-shadow:0 0 24px rgba(255,201,60,.45); }
  label { display:flex; justify-content:space-between; align-items:center; margin:10px 0; gap:12px; padding:12px 16px; border-radius:16px; background:rgba(255,255,255,.07); border:1px solid var(--line); font-weight:700; font-size:17px; }
  input, select, button { font:inherit; padding:8px 12px; border-radius:12px; border:1px solid var(--line); background:rgba(255,255,255,.1); color:var(--fg); }
  select { min-width:150px; font-size:16px; font-weight:700; background:#fff; color:var(--navy); border:0; cursor:pointer; }
  select option { color:var(--navy); }
  button { background:var(--gold); color:var(--navy); border:none; cursor:pointer; width:100%; padding:15px; font-weight:800; font-size:18px; margin-top:18px; border-radius:16px; box-shadow:0 5px 0 #c98a00; transition:transform .1s; }
  button:active { transform:translateY(3px); box-shadow:0 2px 0 #c98a00; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:3px solid #fff; outline-offset:2px; }
  .cho { font-size:72px; font-weight:800; text-align:center; letter-spacing:12px; margin:8px 0; }
  .info { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:16px; font-weight:700; }
  .info b { color:var(--gold); font-size:1.25em; }
  #timeInfo { font-family:"Black Han Sans",sans-serif; font-size:26px; color:#fff; font-variant-numeric:tabular-nums; }
  .bar { height:12px; background:rgba(255,255,255,.12); border-radius:99px; overflow:hidden; margin:10px 0 14px; }
  .bar div { height:100%; border-radius:99px; background:linear-gradient(90deg,var(--red),var(--gold)); transition:width .1s linear; }
  #word { width:100%; font-size:22px; text-align:center; margin-top:10px; }
  #msg { text-align:center; min-height:24px; margin:10px 0; font-size:16px; font-weight:700; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .chips span { background:rgba(76,155,255,.22); border:1px solid rgba(76,155,255,.5); border-radius:999px; padding:6px 14px; font-weight:700; }
  .big { font-family:"Black Han Sans",sans-serif; font-size:clamp(34px,5vw,56px); text-align:center; font-weight:400; margin:8px 0 16px; }
  .ok { color:var(--ok); } .bad { color:#ff7a6b; }
  .hidden { display:none; }
  .mic { text-align:center; padding:12px; border-radius:16px; margin-top:10px; font-weight:700; background:rgba(232,48,42,.18); border:1px solid rgba(232,48,42,.55); animation:pulse 1.5s infinite; }
  @keyframes pulse { 50% { opacity:.55; } }
  #pass { background:rgba(255,255,255,.14); color:#fff; box-shadow:0 5px 0 rgba(0,0,0,.35); }
  .navrow { display:flex; gap:10px; margin-top:16px; } .navrow.hidden { display:none; }
  .navrow button { margin:0; padding:12px; font-size:16px; background:rgba(255,255,255,.14); color:#fff; box-shadow:0 4px 0 rgba(0,0,0,.35); }
  .stage { position:relative; background:#000; border-radius:22px; overflow:hidden; aspect-ratio:16/9; margin:8px 0 12px; border:3px solid rgba(255,255,255,.2); box-shadow:0 18px 40px rgba(0,0,0,.45); }
  .stage video[hidden] { display:none; }
  .stage video { width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  .stage .cho { position:absolute; top:14px; left:50%; transform:translateX(-50%); margin:0; padding:4px 28px 4px 40px;
    font-family:"Black Han Sans",sans-serif; font-size:clamp(64px, 12vw, 128px); font-weight:400; letter-spacing:.3em; color:var(--gold);
    background:rgba(6,35,94,.82); border:3px solid var(--gold); border-radius:24px; text-shadow:0 4px 14px rgba(0,0,0,.6); white-space:nowrap; box-shadow:0 10px 30px rgba(0,0,0,.45); }
  #heard { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:16px;
    font-family:"Black Han Sans",sans-serif; font-size:clamp(40px, 10vw, 96px); font-weight:400; color:#fff; text-shadow:0 0 14px #000, 0 0 4px #000; pointer-events:none; }
  #heard.ok { color:#5ef08f; } #heard.bad { color:#ff7a5c; }
  .btns { display:flex; gap:10px; } .btns button { margin-top:12px; }
  #accept { background:var(--ok); color:#053b26; box-shadow:0 5px 0 #1f9a68; }
  #swear { position:fixed; left:50%; top:40%; transform:translate(-50%,-50%) scale(.6); opacity:0; pointer-events:none; z-index:10;
    background:#d62828; color:#fff; font-size:clamp(24px, 5vw, 44px); font-weight:900; text-align:center;
    padding:28px 40px; border-radius:20px; border:6px solid #fff; box-shadow:0 0 0 6px #d62828, 0 12px 40px rgba(0,0,0,.5);
    transition:transform .2s, opacity .2s; }
  #swear.on { opacity:1; transform:translate(-50%,-50%) scale(1); animation:shake .4s; }
  @keyframes shake { 25% { margin-left:-12px; } 75% { margin-left:12px; } }
  .credit { text-align:center; font-size:12px; color:var(--muted); margin:22px 0 0; letter-spacing:.02em; }
  #cheer { text-align:center; font-size:22px; font-weight:800; color:var(--gold); min-height:30px; margin-top:12px; transition:opacity .3s; }
/* 위쪽 버튼 줄: 화면 위에 붙어 있고 카드를 가리지 않음 */
.fsbar{position:sticky;top:0;z-index:30;width:100%;max-width:1000px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;padding:10px 0;margin-bottom:clamp(6px,2vh,20px)}
.fsbar #start{background:var(--gold);color:var(--navy);border-color:var(--gold);font-size:16px;padding:9px 20px}
.fsbar button{width:auto;margin:0;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:8px 14px;background:rgba(5,15,38,.8);color:#fff;font-size:14px;font-weight:700;cursor:pointer;box-shadow:none}
.fsbar,.card{zoom:var(--tvz,1)}
</style>
<script>
// 모든 게임 공통 카메라: 한 번 고른 카메라(slg-cam)를 모든 게임이 같이 씀 → 없으면 후면 카메라 우선
const slgLS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
async function slgOpenCam(deviceId,w,h,facing){
  // 휴대폰·PC·TV 어디서든 켜지게: 기억한 카메라 → 후면 → 아무 카메라 → 가장 단순한 요청 → 남은 카메라 하나씩
  const md=navigator.mediaDevices, old=navigator.getUserMedia||navigator.webkitGetUserMedia||navigator.mozGetUserMedia;
  const gum=v=>md&&md.getUserMedia?md.getUserMedia({audio:false,video:v})
    :old?new Promise((ok,no)=>old.call(navigator,{audio:false,video:v},ok,no)):Promise.reject({name:'NotFoundError'}); // 옛날 TV 브라우저용
  const size={width:{ideal:w},height:{ideal:h}}, saved=deviceId||slgLS.get('slg-cam'), tries=[];
  if(saved) tries.push({deviceId:{exact:saved},...size});
  tries.push({facingMode:{ideal:facing||'environment'},...size}, size, true);
  let err;
  for(const v of tries){
    try{ const s=await gum(v); if(deviceId&&v===tries[0]) slgLS.set('slg-cam',deviceId); return s; }
    catch(e){ err=e; if(e&&(e.name==='NotAllowedError'||e.name==='SecurityError')) throw e; // 권한 거절이면 더 묻지 않음
      if(saved&&v===tries[0]&&!deviceId) slgLS.set('slg-cam',null); } // 기억한 카메라가 빠졌으면 잊음
  }
  try{ for(const d of (await md.enumerateDevices()).filter(d=>d.kind==='videoinput')) try{ return await gum({deviceId:{exact:d.deviceId}}); }catch(e){} }catch(e){} // 다른 프로그램이 쓰는 카메라는 건너뜀
  throw err;
}
const slgSet=s=>{ const t=s&&s.getVideoTracks()[0]; return t&&t.getSettings?t.getSettings():{}; }; // 지금 켜진 카메라 정보 (옛 브라우저는 빈 값)
async function slgCams(){ try{ return (await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput'); }catch(e){ return []; } }
</script>
<script>
// 음성 인식: 홈 화면이 하나만 계속 켜 두고 들린 말을 나눠 줌 → 게임을 옮겨도 끊기지 않고 시작하자마자 들림
// (마이크 고르기·권한 허용은 홈 화면 [🎥 카메라 · 마이크]에서)
try{ if(parent!==window&&parent.SlgSR) window.SpeechRecognition=window.webkitSpeechRecognition=parent.SlgSR; }catch(e){}
function slgRecStart(rec){ (window.slgRecs=window.slgRecs||new Set).add(rec);
  if(!rec.slgW){ rec.slgW=1; const h=rec.onresult; // slgFresh 순간에 말하던 문장만 건너뛰고 나머지는 게임에 넘김
    rec.addEventListener('start',()=>{ rec.slgMark=rec.slgLast=null; }); // 새로 켜지면 하던 말은 끝난 것
    rec.onresult=e=>{
      const n=e.results.length, r=e.results[n-1], m=rec.slgMark; rec.slgLast=r&&{i:n-1,t:r[0].transcript,f:r.isFinal};
      if(m){ const x=e.results[m.i]; // 번호가 아니라 내용으로 같은 문장인지 봄 (안드로이드는 새 말도 같은 번호로 보냄)
        if(x&&e.resultIndex<=m.i&&slgSame(x[0].transcript,m.t)){ if(x.isFinal) rec.slgMark=null; Object.defineProperty(e,'resultIndex',{value:m.i+1}); }
        else rec.slgMark=null; }
      if(e.resultIndex<n&&h) h(e); }; }
  try{ rec.start(); }catch(e){} } // 이미 듣는 중이면 무시
const slgSame=(a,b)=>{ a=String(a).replace(/\s/g,''); b=String(b).replace(/\s/g,''); return a.startsWith(b)||b.startsWith(a); };
function slgFresh(rec){ if(rec) rec.slgMark=rec.slgLast&&!rec.slgLast.f?{i:rec.slgLast.i,t:rec.slgLast.t}:null; } // 카운터 시작 순간: 그때 말하던 문장("시작" 등)만 버림
const slgRecMsg=e=>({'not-allowed':'마이크 권한이 없어요. 홈 화면에서 [한 번에 허용하기]를 눌러 주세요','service-not-allowed':'이 브라우저는 음성 인식을 막고 있어요. 크롬이나 엣지로 열어 주세요',
  'audio-capture':'마이크를 찾지 못했어요. 블루투스 마이크라면 기기의 기본 마이크로 연결돼 있는지 확인해 주세요','network':'음성 인식은 인터넷 연결이 필요해요'})[e.error]||'';
// "시작"이라고 말하면 시작
const slgSaidStart=t=>/시작|스타트|start/i.test(String(t).replace(/\s/g,''));
function slgVoiceStart(fn){ // 음성 인식을 따로 안 쓰는 게임용: 계속 듣다가 "시작"이 들리면 fn()
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return;
  const rec=new SR(); rec.lang='ko-KR'; rec.continuous=true; rec.interimResults=true; let on=true, last=0;
  rec.onresult=e=>{ for(let i=e.resultIndex;i<e.results.length;i++) if(slgSaidStart(e.results[i][0].transcript)&&Date.now()-last>3000){ last=Date.now(); fn(); } };
  rec.onerror=e=>{ if(e.error==='not-allowed'||e.error==='service-not-allowed') on=false; };
  rec.onend=()=>{ if(on) setTimeout(()=>slgRecStart(rec),300); }; // 조용하면 끊기므로 다시 켬
  slgRecStart(rec);
}
</script>
<script>
// 전체 화면 켜기/끄기 (게임 공통). 아이폰처럼 지원 안 하는 기기는 안내
const SLG_NOFULL='이 기기(아이폰 등)는 브라우저 전체 화면을 지원하지 않아요. 공유 버튼 → 「홈 화면에 추가」로 열면 화면을 꽉 채워요.';
function slgToggleFull(){
  const d=document, el=d.documentElement, cur=d.fullscreenElement||d.webkitFullscreenElement, rq=el.requestFullscreen||el.webkitRequestFullscreen;
  try{ const p=cur?(d.exitFullscreen||d.webkitExitFullscreen).call(d):rq?rq.call(el):(alert(SLG_NOFULL),null); p&&p.catch&&p.catch(()=>{}); }catch(e){}
}
</script>
</head>
<body>
<div class="fsbar"><button id="start" type="button">▶ 게임 시작</button><button id="fsBtn" type="button">전체 화면</button></div>
<div class="card wide">
  <h1>초성 퀴즈</h1>

  <section id="setup">
    <label>초성 글자 수
      <select id="len"><option value="2">2글자 (쉬움)</option><option value="3">3글자 (어려움)</option><option value="0">섞어서</option></select>
    </label>
    <label>1문제당 시간 <select id="sec"><option value="10">10초</option><option value="20">20초</option><option value="30" selected>30초</option><option value="45">45초</option><option value="60">60초</option><option value="90">90초</option><option value="120">120초</option></select></label>
    <label>1문제당 정답 개수 <select id="goal"><option value="1" selected>1개</option><option value="2">2개</option><option value="3">3개</option><option value="4">4개</option><option value="5">5개</option><option value="6">6개</option><option value="7">7개</option><option value="8">8개</option><option value="9">9개</option><option value="10">10개</option></select></label>
    <label>문제 수 <select id="rounds"><option value="1">1문제</option><option value="3">3문제</option><option value="5" selected>5문제</option><option value="10">10문제</option><option value="15">15문제</option><option value="20">20문제</option></select></label>
  </section>

  <section id="play" class="hidden">
    <div class="info"><span id="roundInfo"></span><span id="timeInfo"></span></div>
    <div class="bar"><div id="timeBar"></div></div>
    <div class="stage">
      <video id="cam" autoplay muted playsinline></video>
      <div class="cho" id="cho"></div>
      <div id="heard"></div>
    </div>
    <div class="info"><span>정답 <b id="countInfo">0</b> / <b id="goalInfo"></b>개</span></div>
    <div id="mic" class="mic">🎤 듣는 중… 단어를 말하세요</div>
    <input id="word" autocomplete="off" placeholder="단어 입력 후 Enter">
    <div id="msg"></div>
    <div id="cheer"></div>
    <div class="chips" id="found"></div>
    <div class="btns"><button id="accept">성공 (인정)</button><button id="pass">통과</button></div>
  </section>

  <section id="result" class="hidden">
    <div class="big" id="resTitle"></div>
    <div class="chips" id="resFound"></div>
    <p class="info" style="justify-content:center">이런 단어도 있어요</p>
    <div class="chips" id="resHint"></div>
    <button id="next">다음 문제</button>
  </section>

  <section id="final" class="hidden">
    <div class="big" id="finalTitle"></div>
    <p style="text-align:center" id="finalDetail"></p>
    <button id="again">다시 하기</button>
  </section>
  <div id="navrow" class="navrow hidden"><button id="home" type="button">← 뒤로가기</button><button id="goHome" type="button">🏠 홈으로 가기</button></div>
  <p class="credit">단어 데이터 : 국립국어원 표준국어대사전</p>
</div>
<div id="swear">🚫 욕설은<br>인정되지 않습니다!</div>

<script>

  $('swear').classList.add('on');
  clearTimeout(swearTimer);
  swearTimer = setTimeout(() => $('swear').classList.remove('on'), 2000);
}
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
// 출제용 단어 — 여기서 초성을 뽑으니 정답이 최소 하나는 보장됨
const WORDS = `사과 바다 학교 친구 가방 나무 노래 우유 커피 사랑 시간 하늘 구름 바람 기차 버스 의자 책상 연필 공책
시계 안경 모자 신발 양말 바지 치마 우산 가수 배우 의사 경찰 요리 음식 과자 라면 김치 두부 계란 수박 포도 딸기
참외 감자 당근 오이 호박 마늘 생선 고기 사자 토끼 여우 늑대 기린 하마 나비 개미 거미 모기 오리 참새 공항 병원
약국 시장 은행 극장 식당 도시 시골 마을 거리 공원 운동 축구 야구 농구 수영 등산 여행 사진 영화 음악 그림 편지
선물 생일 방학 숙제 시험 공부 수학 과학 역사 국어 영어 전화 문자 지갑 열쇠 창문 거울 이불 베개 청소 빨래 아침
점심 저녁 주말 가을 겨울 여름 하루 오늘 내일 고구마 자동차 컴퓨터 비행기 냉장고 세탁기 선풍기 자전거 지하철
경찰서 소방서 도서관 운동장 놀이터 미술관 박물관 수영장 대학교 할머니 어머니 아버지 선생님 바나나 토마토 오렌지
복숭아 옥수수 호랑이 코끼리 고양이 강아지 원숭이 거북이 다람쥐 두더지 개구리 무지개 눈사람 초콜릿 떡볶이 비빔밥
햄버거 피아노 노트북 휴대폰 손수건 화장실 운동화 청바지 목도리 우체국 백화점 편의점 주유소 미용실 정류장 민들레
진달래 개나리 소나무 대나무 일요일 월요일 금요일 토요일 수요일 목요일 화요일 축구공 야구장 농구공 수영복`.split(/\s+/);

const $ = id => document.getElementById(id);
const toCho = w => [...w].map(c => {
  const i = c.charCodeAt(0) - 0xAC00;
  return i >= 0 && i < 11172 ? CHO[Math.floor(i / 588)] : '?';
}).join('');

let cfg, round, total, cleared, cho, found, deadline, timer, playing = false;

function show(id) {
  for (const s of ['setup','play','result','final']) $(s).classList.toggle('hidden', s !== id);
  $('start').hidden = id !== 'setup';
  $('navrow').classList.toggle('hidden', id === 'setup' || id === 'final'); // 게임 중·결과 화면에서만 (마지막 화면엔 [다시 하기]·[홈]이 있음)
}

$('start').onclick = () => {
  const num = (id, min, max) => Math.min(max, Math.max(min, parseInt($(id).value) || min));
  cfg = { len: +$('len').value, sec: num('sec', 5, 300), goal: num('goal', 1, 50), rounds: num('rounds', 1, 30) };
  round = 0; total = 0; cleared = 0;
  nextRound();
};

function nextRound() {
  round++;
  const pool = cfg.len ? WORDS.filter(w => w.length === cfg.len) : WORDS;
  cho = toCho(pool[Math.floor(Math.random() * pool.length)]);
  found = [];
  $('cho').textContent = cho;
  $('roundInfo').textContent = `${round}번 문제 / 총 ${cfg.rounds}문제`;
  $('goalInfo').textContent = cfg.goal;
  $('countInfo').textContent = 0;
  $('found').innerHTML = ''; $('msg').textContent = ''; $('word').value = '';
  lastHeard = ''; setHeard(''); playing = true; $('cheer').textContent = '시작! 화이팅! 🎉';
  show('play'); $('word').focus(); camOn(); micOn(); slgFresh(rec);
  deadline = Date.now() + cfg.sec * 1000;
  clearInterval(timer);
  timer = setInterval(tick, 100); tick();
}

function tick() {
  const left = Math.max(0, deadline - Date.now());
  $('timeInfo').textContent = (left / 1000).toFixed(1) + '초';
  $('timeBar').style.width = (left / cfg.sec / 10) + '%';
  if (!left) endRound();
}

// 음성 인식 (Chrome/Edge). 지원 안 되면 입력창으로 대체
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec, listening = false;
if (SR) {
  rec = new SR();
  rec.lang = 'ko-KR'; rec.continuous = true; rec.interimResults = true;
  rec.onresult = e => {
    if (!playing) { // 게임 밖: "시작"이라고 하면 시작(설정 화면) / 다음 문제(결과 화면)
      if (slgSaidStart([...e.results].slice(e.resultIndex).map(r => r[0].transcript).join(' '))) {
        if (!$('setup').classList.contains('hidden')) $('start').click(); else if (!$('result').classList.contains('hidden')) $('next').click();
      }
      return;
    }
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const raw = e.results[i][0].transcript;
      const heard = raw.replace(/[^가-힣\s]/g, '').trim();
      // 크롬이 욕을 ***로 가려서 줄 때도 있음
      const swear = SWEAR.test(heard.replace(/\s/g, '')) || /\*/.test(raw);
      if (swear) {
        setHeard('🚫', 'bad'); lastHeard = '';
        if (e.results[i].isFinal) { swearAlert(); msg('욕설은 인정되지 않습니다!', false); }
        continue;
      }
      if (heard) lastHeard = heard;
      if (!e.results[i].isFinal) { setHeard(heard); continue; } // 말하는 중 실시간 표시
      const parts = heard.split(/\s+/).filter(Boolean);
      const joined = parts.join('');
      // "고 양이"처럼 띄어 들리면 붙여서도 시도
      const tries = toCho(joined) === cho ? [joined] : parts;
      const rs = tries.map(w => addWord(w, true));
      const hit = rs.includes('ok');
      if (!hit && !rs.includes('err') && heard) msg(`"${heard}" — 초성이 안 맞아요`, false);
      setHeard(heard, hit ? 'ok' : 'bad');
      if (hit) lastHeard = ''; // 이미 인정된 말은 성공 버튼 대상에서 제외
    }
  };
  rec.onerror = e => { const m = slgRecMsg(e); if (m) msg(m, false); if (e.error === 'not-allowed' || e.error === 'service-not-allowed') listening = false; }; // 안 될 때 이유를 화면에
  rec.onend = () => { if (listening) slgRecStart(rec); }; // 침묵하면 끊기므로 재시작
  $('word').classList.add('hidden');
} else {
  $('mic').classList.add('hidden');
}
function micOn() { if (rec && !listening) { listening = true; slgRecStart(rec); } }
function micOff() { if (rec) { listening = false; rec.stop(); } }

let lastHeard = '';
function setHeard(t, cls = '') { $('heard').textContent = t; $('heard').className = cls; }

// 카메라 라이브 화면 (한 번 켜면 계속 유지)
let camStream;
async function camOn() {
  if (camStream) return;
  try {
    camStream = await slgOpenCam(null, 1280, 720);
    $('cam').srcObject = camStream; $('cam').hidden = false;
  } catch { $('cam').hidden = true; } // 카메라 없이도 진행 (초성 글자만 보임)
}

// 통과: 결과 화면 없이 바로 다음 초성
$('pass').onclick = () => {
  if (!playing) return;
  stopRound(found.length >= cfg.goal);
  $('next').onclick();
};

// 지도자 판정: 마지막으로 들린 말을 초성 검사 없이 인정
$('accept').onclick = () => {
  if (!playing) return;
  let w = lastHeard.replace(/\s+/g, '');
  if (!w || found.includes(w)) w = `인정 ${found.length + 1}`;
  msg(`지도자 인정! "${w}"`, true);
  setHeard(w, 'ok');
  lastHeard = '';
  pushFound(w);
};

$('word').onkeydown = e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  const w = $('word').value.trim();
  $('word').value = '';
  if (w) addWord(w);
};

// 'ok' 인정 / 'err' 이유 표시함 / 'miss' 초성 불일치(음성일 땐 조용히)
function addWord(w, quiet) {
  if (!playing) return 'ok';
  let err = '';
  if (SWEAR.test(w)) { swearAlert(); msg('욕설은 인정되지 않습니다!', false); return 'err'; }
  if (toCho(w) !== cho) err = `초성이 달라요 (${toCho(w)})`;
  else if (found.includes(w)) err = `"${w}" 이미 말한 단어예요`;
  if (err && quiet && toCho(w) !== cho) return 'miss';
  msg(err || `좋아요! "${w}"`, !err);
  if (err) return 'err';
  pushFound(w);
  return 'ok';
}

// 목표 개수 채우면 결과 화면 없이 바로 다음 미션
function pushFound(w) {
  found.push(w);
  $('countInfo').textContent = found.length;
  $('found').insertAdjacentHTML('beforeend', `<span>${esc(w)}</span>`);
  if (found.length < cfg.goal) return;
  stopRound(true);
  setHeard('성공! 🎉', 'ok');
  msg(round < cfg.rounds ? '다음 문제로 넘어가요…' : '마지막 문제 성공!', true);
  advanceTimer = setTimeout(() => $('next').onclick(), 1200);
}

function stopRound(ok) {
  playing = false;
  clearInterval(timer); // 마이크는 끄지 않음 — 다시 켤 때마다 권한을 묻기 때문
  total += found.length; if (ok) cleared++;
}

// 응원 멘트: 게임 중 4초마다 랜덤
const CHEERS = ['잘하고 있어요! 👍', '조금만 더 힘내요! 💪', '할 수 있어요! 🔥', '천재 아니에요? 🤩', '생각나는 대로 말해봐요!',
  '멋져요! 계속 가요! 🚀', '머리 회전 최고! 🧠', '포기하지 마요! 🌟', '거의 다 왔어요! 🏁', '오늘 컨디션 좋은데요? 😎',
  '천천히 떠올려봐요 🙂', '우와, 대단해요! 👏', '집중! 집중! 🎯', '한 개만 더! ✨', '최고예요! 🏆'];
setInterval(() => {
  if (!playing) return;
  let t; do t = CHEERS[Math.floor(Math.random() * CHEERS.length)]; while (t === $('cheer').textContent);
  $('cheer').textContent = t;
}, 4000);

function msg(t, ok) { $('msg').textContent = t; $('msg').className = ok ? 'ok' : 'bad'; }
const esc = s => s.replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
const chips = arr => arr.map(w => `<span>${esc(w)}</span>`).join('') || '<span>없음</span>';

function endRound() {
  if (!playing) return;
  const ok = found.length >= cfg.goal;
  stopRound(ok);
  $('resTitle').innerHTML = `<span class="${ok ? 'ok' : 'bad'}">${ok ? '성공!' : '실패'}</span> ${found.length} / ${cfg.goal}개`;
  $('resFound').innerHTML = chips(found);
  // 자주 쓰는 순서로 10개
  $('resHint').innerHTML = chips(NOUNS.filter(w => toCho(w) === cho && !SWEAR.test(w) && !found.includes(w)).slice(0, 10));
  $('next').textContent = round < cfg.rounds ? '다음 문제' : '결과 보기';
  show('result'); $('next').focus();
}

$('next').onclick = () => {
  if (round < cfg.rounds) return nextRound();
  $('finalTitle').textContent = `${cfg.rounds}문제 중 ${cleared}문제 성공`;
  $('finalDetail').textContent = `총 ${total}개 단어를 맞혔어요`;
  show('final');
};
$('again').onclick = () => show('setup');

// 홈: 진행 중인 게임을 기록 없이 중단하고 설정 화면으로
let advanceTimer;
// 뒤로가기: 진행 중인 게임을 기록 없이 멈추고 설정 화면으로 / 홈으로 가기: 게임 메뉴로
$('home').onclick = () => {
  playing = false;
  clearInterval(timer); clearTimeout(advanceTimer);
  show('setup');
};
$('goHome').onclick = () => { playing = false; clearInterval(timer); clearTimeout(advanceTimer); parent.location.hash = ''; };
$('fsBtn').onclick = slgToggleFull;
camOn(); micOn(); // 들어오자마자 카메라·마이크 켜기 ("시작"을 듣도록)
</script>
</body>
</html>
