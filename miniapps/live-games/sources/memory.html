<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>서린 메모리 배틀</title>
<style>
:root{
  --bg:#07182e;--bg2:#0e2e58;--yellow:#ffd43b;--white:#f7fbff;
  --muted:#b7c8dc;--green:#38d996
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Arial,"Noto Sans KR",sans-serif;background:
radial-gradient(circle at 15% 0%,#174b89 0%,transparent 28%),linear-gradient(160deg,var(--bg2),var(--bg));color:var(--white);overflow:hidden}
button,select{font:inherit} button{cursor:pointer}
.app{height:100%;display:flex;flex-direction:column}
header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(3,14,29,.72);border-bottom:1px solid rgba(255,255,255,.1)}
.brand{display:flex;gap:10px;align-items:center} .logo{height:44px;width:auto;display:block}
h1{font-size:20px;margin:0} .sub{font-size:11px;color:var(--muted);margin-top:2px}
.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:0;border-radius:11px;padding:9px 12px;background:#214d7d;color:#fff;font-weight:900}
.btn.primary{background:var(--yellow);color:#09213e} .btn:disabled{opacity:.4;cursor:not-allowed}
.main{flex:1;min-height:0;display:flex;gap:10px;padding:10px}
.board-wrap{flex:1;min-width:0;background:rgba(5,18,36,.55);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:9px}
#board{height:100%;display:grid;gap:7px}
.card{border:0;background:transparent;padding:0;perspective:900px;min-width:0;min-height:0;container-type:size;display:grid;place-items:center;--cw:min(100cqw,calc(100cqh*5/7))}
.inner{position:relative;width:var(--cw);height:calc(var(--cw)*7/5);transform-style:preserve-3d;transition:.3s}
.card.flipped .inner,.card.matched .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:calc(var(--cw)*.08);box-shadow:0 6px 16px rgba(0,0,0,.35);backface-visibility:hidden;overflow:hidden;display:flex;align-items:center;justify-content:center}
.back{background:#fff}
.back::before{ /* 카드 안쪽 무늬판 */
  content:"";position:absolute;inset:6%;border-radius:calc(var(--cw)*.05);
  background:
    repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 4px,transparent 4px 10px),
    repeating-linear-gradient(-45deg,rgba(255,255,255,.07) 0 4px,transparent 4px 10px),
    radial-gradient(circle at 50% 40%,#3a8bf0,#1452a8 60%,#0c2a63);
  box-shadow:inset 0 0 0 calc(var(--cw)*.018) #ffd43b,inset 0 0 0 calc(var(--cw)*.03) #1452a8,inset 0 0 0 calc(var(--cw)*.036) rgba(255,255,255,.6);
}
.back .cn{position:absolute;z-index:3;font-weight:1000;font-size:calc(var(--cw)*.12);line-height:1;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.back .cn.tl{top:11%;left:12%}
.back .cn.br{bottom:11%;right:12%;transform:rotate(180deg)}

<script>
// 모든 게임 공통 카메라: 한 번 고른 카메라(slg-cam)를 모든 게임이 같이 씀 → 없으면 후면 카메라 우선
const slgLS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
async function slgOpenCam(deviceId,w,h,facing){
  // 휴대폰·PC·TV 어디서든 켜지게: 기억한 카메라 → 후면 → 아무 카메라 → 가장 단순한 요청 → 남은 카메라 하나씩
  const md=navigator.mediaDevices, old=navigator.getUserMedia||navigator.webkitGetUserMedia||navigator.mozGetUserMedia;
  const gum=v=>md&&md.getUserMedia?md.getUserMedia({audio:false,video:v})
    :old?new Promise((ok,no)=>old.call(navigator,{audio:false,video:v},ok,no)):Promise.reject({name:'NotFoundError'}); // 옛날 TV 브라우저용
  const size={width:{ideal:w},height:{ideal:h}}, saved=deviceId||slgLS.get('slg-cam'), tries=[];
  if(saved) tries.push({deviceId:{exact:saved},...size});
  tries.push({facingMode:{ideal:facing||'environment'},...size}, size, true);
  let err;
  for(const v of tries){
    try{ const s=await gum(v); if(deviceId&&v===tries[0]) slgLS.set('slg-cam',deviceId); return s; }
    catch(e){ err=e; if(e&&(e.name==='NotAllowedError'||e.name==='SecurityError')) throw e; // 권한 거절이면 더 묻지 않음

  <div class="ptop"><h2>메모리 배틀</h2><button class="btn primary start" id="startBtn" disabled>게임 시작</button></div>
  <p>카드 뒷면에는 숫자와 함께 <b>서린 로고 실루엣</b>이 들어갑니다. 공개 시간은 원하는 초를 직접 입력할 수 있고, 남은 카드는 게임 중 다시 섞을 수 있습니다.</p>
  <div class="pickbox">
    <div class="pickrow">
      <button class="btn primary" id="folderBtn">📁 사진 폴더 선택</button>
      <button class="btn" id="filesBtn">🖼 사진 여러 장 선택</button>
    </div>
    <input id="folderInput" type="file" webkitdirectory directory multiple accept="image/*">
    <input id="filesInput" type="file" multiple accept="image/*">

<script>
let photos=[], cards=[], first=null, second=null, lock=true, currentTeam=0, teams=[], matched=0, revealTimer=null;
const board=document.getElementById('board'),setup=document.getElementById('setup'),teamsEl=document.getElementById('teams'),
turnTeam=document.getElementById('turnTeam'),statusEl=document.getElementById('status'),countEl=document.getElementById('count'),
cardCount=document.getElementById('cardCount'),startBtn=document.getElementById('startBtn'),photoInfo=document.getElementById('photoInfo');

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function loadFiles(list){
  photos.forEach(p=>URL.revokeObjectURL(p.url));
  const arr=[...list].filter(f=>f.type.startsWith('image/') || /\.(jpg|jpeg|png|webp|gif|bmp|heic|heif)$/i.test(f.name));
  photos=arr.map(f=>({name:f.name,url:URL.createObjectURL(f)}));

  cardCount.innerHTML='';
  if(photos.length<2){
    photoInfo.innerHTML='사진을 <strong>2장 이상</strong> 선택해 주세요.';
    startBtn.disabled=true; return;
  }

  const maxCards=Math.min(48, photos.length*2);
  for(let n=4;n<=maxCards;n+=2){
    const o=document.createElement('option');
    o.value=n;
    o.textContent=`${n}장 (${n/2}쌍)`;
    cardCount.appendChild(o);
  }

  const preferred=[16,24,32,40,48].reverse().find(n=>n<=maxCards) || maxCards;
  cardCount.value=String(preferred);

  const usable=Math.min(24,photos.length);
  photoInfo.innerHTML=
    `사진 <strong>${photos.length}장</strong> 인식 완료 · 사진 저장 개수 제한 없음<br>`+
    `한 게임에는 최대 <strong>${usable}장</strong>의 서로 다른 사진을 랜덤 사용 · 최대 <strong>${maxCards}카드</strong>`;
  startBtn.disabled=false;
}

document.getElementById('folderBtn').onclick=()=>document.getElementById('folderInput').click();
document.getElementById('filesBtn').onclick=()=>document.getElementById('filesInput').click();
document.getElementById('folderInput').onchange=e=>loadFiles(e.target.files);
document.getElementById('filesInput').onchange=e=>loadFiles(e.target.files);

// 화면 크기에 맞춰 카드(5:7)가 가장 크게 보이는 줄·칸 수를 고름
function gridFor(n){
  const W=board.clientWidth||900, H=board.clientHeight||540, gap=7; let cols=1, best=0;
  for(let c=1;c<=n;c++){ const r=Math.ceil(n/c), w=Math.min((W-gap*(c-1))/c,(H-gap*(r-1))/r*5/7); if(w>best){best=w; cols=c;} }
  board.style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;
  board.style.gridTemplateRows=`repeat(${Math.ceil(n/cols)},minmax(0,1fr))`;
}
addEventListener('resize',()=>{ if(cards.length) gridFor(cards.length); });
function renderTeams(){
  teamsEl.innerHTML='';
  teams.forEach((t,i)=>{
    const d=document.createElement('div');d.className='team'+(i===currentTeam?' active':'');
    d.innerHTML=`<div class="team-name">${t.name}</div><div class="scoreline"><button class="mini" data-i="${i}" data-a="-">−</button><div class="score">${t.score}</div><button class="mini" data-i="${i}" data-a="+">+</button></div>`;
    teamsEl.appendChild(d)
  });
  turnTeam.textContent=teams[currentTeam]?.name||'';
  teamsEl.querySelectorAll('.mini').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const i=+b.dataset.i;
    teams[i].score=Math.max(0,teams[i].score+(b.dataset.a==='+'?1:-1));
    renderTeams()
  })
}
function makeBoard(n){
  gridFor(n);matched=0;
  const chosen=shuffle([...photos]).slice(0,n/2);
  const deck=shuffle([...chosen,...chosen]);
  cards=deck.map((p,i)=>({p,i,matched:false}));
  board.innerHTML='';
  cards.forEach((c,i)=>{
    const b=document.createElement('button');b.className='card';
    b.innerHTML=`<div class="inner"><div class="face back"><div class="logoMark"></div><span class="cn tl">${i+1}</span><span class="num">${i+1}</span><span class="cn br">${i+1}</span></div><div class="face front"><img class="fill" src="${c.p.url}" alt=""><img src="${c.p.url}" alt=""></div></div>`;
    b.onclick=()=>flip(i,b);board.appendChild(b)
  })
}
function flip(i,el){
  if(lock||cards[i].matched||el.classList.contains('flipped'))return;
  el.classList.add('flipped');
  if(!first){first={i,el};statusEl.innerHTML=`<b>${i+1}번</b> 선택 · 한 장 더!`;return}
  second={i,el};lock=true;
  if(cards[first.i].p.url===cards[second.i].p.url){
    setTimeout(()=>{
      cards[first.i].matched=cards[second.i].matched=true;
      first.el.classList.add('matched');
      second.el.classList.add('matched');
      teams[currentTeam].score++;matched++;
      toast(`${teams[currentTeam].name} 정답! +1점`);
      renderTeams();reset();lock=false;
      statusEl.innerHTML=`정답! <b>${teams[currentTeam].name}</b> 한 번 더`;
      if(matched===cards.length/2)endGame()
    },400)
  }else{
    setTimeout(()=>{
      first.el.classList.remove('flipped');
      second.el.classList.remove('flipped');
      currentTeam=(currentTeam+1)%teams.length;
      renderTeams();reset();lock=false;
      statusEl.innerHTML=`다음은 <b>${teams[currentTeam].name}</b> 차례`
    },800)
  }
}
function reset(){first=null;second=null}
function startGame(){
  const n=+cardCount.value,tc=+document.getElementById('teamCount').value,sec=+document.getElementById('preview').value;
  teams=Array.from({length:tc},(_,i)=>({name:`${i+1}팀`,score:0}));
  currentTeam=0;renderTeams();makeBoard(n);
  setup.classList.add('hidden');
  document.getElementById('finish').classList.remove('show');
  lock=true;reset();
  document.querySelectorAll('.card').forEach(c=>c.classList.add('flipped'));
  statusEl.innerHTML=`<b>${sec}초</b> 동안 기억하세요!`;
  countdown(sec,()=>{
    document.querySelectorAll('.card').forEach(c=>c.classList.remove('flipped'));
    lock=false;
    statusEl.innerHTML=`<b>${teams[currentTeam].name}</b>부터 시작`
  })
}
function countdown(sec,done){
  let n=sec;
  countEl.textContent=n;
  countEl.classList.add('show');
  const t=setInterval(()=>{
    n--;
    if(n<=0){
      clearInterval(t);
      countEl.textContent='START!';
      setTimeout(()=>{countEl.classList.remove('show');done()},500)
    }else countEl.textContent=n
  },1000)
}
// 공개 중에 한 번 더 누르면 바로 다시 비공개
let revealOld=false;
function hideReveal(){
  clearTimeout(revealTimer); revealTimer=null;
  document.querySelectorAll('.card:not(.matched)').forEach(c=>c.classList.remove('flipped'));
  if(first) first.el.classList.add('flipped'); // 고르던 카드는 그대로 열어 둠
  lock=revealOld; document.getElementById('revealBtn').textContent='공개';
}
function reveal(){
  if(cards.length===0)return;
  if(revealTimer){ hideReveal(); toast('비공개'); return; }
  let sec=parseInt(document.getElementById('revealSeconds').value,10);
  if(!Number.isFinite(sec)) sec=3;
  sec=Math.max(1,Math.min(60,sec));
  document.getElementById('revealSeconds').value=sec;

  revealOld=lock;
  lock=true;
  document.querySelectorAll('.card:not(.matched)').forEach(c=>c.classList.add('flipped'));
  toast(`${sec}초 공개 · 다시 누르면 비공개`);
  document.getElementById('revealBtn').textContent='비공개';
  revealTimer=setTimeout(hideReveal,sec*1000);
}
function reshuffleRemaining(){
  if(cards.length===0){ toast('게임을 먼저 시작해 주세요'); return; }
  if(revealTimer){ toast('공개가 끝난 뒤 섞어 주세요'); return; }
  if(first || second){
    toast('선택 중인 카드를 먼저 마무리해 주세요');
    return;
  }

  lock=true;

  const cardEls=[...document.querySelectorAll('.card')];
  const openIndexes=cards
    .map((c,i)=>({c,i}))
    .filter(x=>!x.c.matched)
    .map(x=>x.i);

  if(openIndexes.length<2){
    toast('섞을 카드가 없습니다');
    lock=false;
    return;
  }

  const remainingPhotos=shuffle(openIndexes.map(i=>cards[i].p));

  openIndexes.forEach((idx,pos)=>{
    cards[idx].p=remainingPhotos[pos];
    cardEls[idx].querySelectorAll('.front img').forEach(img=>img.src=remainingPhotos[pos].url);
    cardEls[idx].classList.remove('flipped');
  });

  statusEl.innerHTML=`남은 카드 <b>${openIndexes.length}장</b>을 다시 섞었습니다.`;
  toast('남은 카드를 다시 섞었습니다');

  setTimeout(()=>{ lock=false; },250);
}

function endGame(){
  lock=true;
  const max=Math.max(...teams.map(t=>t.score));
  const w=teams.filter(t=>t.score===max).map(t=>t.name);
  document.getElementById('winner').textContent=w.length===1?`${w[0]} 승리!`:'무승부!';
  document.getElementById('winnerSub').textContent=`${max}점`;
  setTimeout(()=>document.getElementById('finish').classList.add('show'),600)
}
function toast(m){
  const t=document.getElementById('toast');
  t.textContent=m;t.classList.add('show');
  clearTimeout(t.x);
  t.x=setTimeout(()=>t.classList.remove('show'),1200)
}
function openSetup(){
  document.getElementById('finish').classList.remove('show');
  setup.classList.remove('hidden')
}
startBtn.onclick=()=>{ startGame(); listen(); };
document.getElementById('newBtn').onclick=openSetup;
document.getElementById('revealBtn').onclick=reveal;
document.getElementById('shuffleBtn').onclick=reshuffleRemaining;
document.getElementById('fullBtn').onclick=slgToggleFull;

// ---------- 음성으로 카드 뒤집기: "3번 7번" 하고 부르면 두 장이 뒤집힘 ----------
// 말한 카드 번호 뽑기: "3번 7번", "3번이랑 12번", "삼번 칠번", "이십삼번", "3 7" → [3,7]
// 한글 숫자는 뒤에 "번"이 있을 때만 (조사 "이"를 2로 잘못 읽지 않게)
function cardNums(t){
  const D={일:1,이:2,삼:3,사:4,오:5,육:6,륙:6,칠:7,팔:8,구:9};
  const out=[], re=/(\d+)|([일이삼사오육륙칠팔구십]+)\s*번/g; let m;
  while((m=re.exec(t))){
    if(m[1]){ out.push(+m[1]); continue; }
    let n=0, cur=0;
    for(const ch of m[2]){ if(ch==='십'){ n+=(cur||1)*10; cur=0; } else cur=D[ch]; }
    out.push(n+cur);
  }
  return out;
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null, listening=false;
function flipByNum(n){
  const el=board.children[n-1];
  if(!el||!cards[n-1]){ toast(`${n}번 카드는 없어요`); return; }
  if(cards[n-1].matched){ toast(`${n}번은 이미 맞힌 카드예요`); return; }
  flip(n-1,el);
}
if(SR){
  rec=new SR(); rec.lang='ko-KR'; rec.continuous=true; rec.interimResults=true;
  rec.onresult=e=>{
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(!e.results[i].isFinal){ statusEl.textContent='🎤 '+t; continue; } // 말하는 중 실시간 표시
      if(slgSaidStart(t)&&!setup.classList.contains('hidden')){ if(!startBtn.disabled) startBtn.click(); continue; } // 설정 화면에서 "시작"이라고 하면 게임 시작
      if(lock||!cards.length) continue; // 기억 시간·공개·뒤집는 중에는 무시
      const ns=cardNums(t).filter((n,k,arr)=>arr.indexOf(n)===k).slice(0,2);
      if(!ns.length) continue;
      toast('🎤 '+ns.map(n=>n+'번').join(' · '));
      for(const n of ns){ if(lock) break; flipByNum(n); }
    }
  };
  rec.onerror=e=>{ const m=slgRecMsg(e); if(m) toast(m); if(e.error==='not-allowed'||e.error==='service-not-allowed') listening=false; }; // 안 될 때 이유를 화면에
  rec.onend=()=>{ if(listening) slgRecStart(rec); }; // 조용하면 끊기므로 다시 켬
}
function listen(){ if(rec&&!listening){ listening=true; slgRecStart(rec); } } // 카드 번호를 말하면 뒤집힘 (예: 3번 7번)
listen(); // 처음부터 들어야 "시작"을 알아들음
</script>
